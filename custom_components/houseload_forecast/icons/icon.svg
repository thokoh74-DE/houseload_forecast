  <line x1="115" y1="75" x2="115" y2="109" stroke="#42a5f5" stroke-width="1.5" opacity="0.7"/>
  <line x1="141" y1="75" x2="141" y2="109" stroke="#42a5f5" stroke-width="1.5" opacity="0.7"/>
  <line x1="90" y1="92" x2="166" y2="92" stroke="#42a5f5" stroke-width="1.5" opacity="0.7"/>

  <!-- Lightning bolt / energy symbol -->
  <path d="M136,78 L126,93 L133,93 L122,108 L135,93 L128,93 Z" fill="#ffd54f" opacity="0.9"/>

