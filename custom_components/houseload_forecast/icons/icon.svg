  <rect x="42" y="222" width="12" height="18" rx="2" fill="#42a5f5" opacity="0.85"/>
  <rect x="58" y="216" width="12" height="24" rx="2" fill="#42a5f5" opacity="0.85"/>
  <rect x="74" y="219" width="12" height="21" rx="2" fill="#42a5f5" opacity="0.85"/>
  <rect x="90" y="213" width="12" height="27" rx="2" fill="#66bb6a" opacity="0.85"/>
  <rect x="106" y="208" width="12" height="32" rx="2" fill="#66bb6a" opacity="0.85"/>
  <rect x="122" y="211" width="12" height="29" rx="2" fill="#66bb6a" opacity="0.85"/>
  <rect x="138" y="217" width="12" height="23" rx="2" fill="#ffa726" opacity="0.85"/>
  <rect x="154" y="220" width="12" height="20" rx="2" fill="#ffa726" opacity="0.85"/>
  <rect x="170" y="215" width="12" height="25" rx="2" fill="#ffa726" opacity="0.85"/>
