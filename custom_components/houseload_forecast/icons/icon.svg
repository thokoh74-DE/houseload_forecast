  <rect x="68" y="140" width="30" height="28" rx="3" fill="#90caf9" opacity="0.9"/>
  <line x1="83" y1="140" x2="83" y2="168" stroke="#1a237e" stroke-width="2"/>
  <line x1="68" y1="154" x2="98" y2="154" stroke="#1a237e" stroke-width="2"/>

